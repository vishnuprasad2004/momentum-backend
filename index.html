<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="icon" href="./assets/images/adaptive-icon.png" type="image/png">
	<title>Momentum App</title>
</head>
<body>
	<main class=" bg-gradient-to-r from-[#ff7f2a] to-[#e16614]">
		<div class="flex lg:flex-row flex-col items-center justify-center">
			<div class="lg:w-xl">
				<img src="./assets/images/logo-l.png" alt="" class="logo">
				<h1 class="">Get ready to <span class="highlight">supercharge</span> your goals and <span class="highlight">productivity</span> with Momentum.</h1>
				<a id="download-btn" href="https://github.com/vishnuprasad2004/momentum/releases/download/v2.0.5-beta/application-07f1ae49-eadd-4a59-bc87-2904669f72c3.apk" target="_blank">
					<button class="download-btn">
						<i class="fa-brands fa-github"></i>
						<span>Download Now from Github</span>
					</button>
				</a>
			</div>
			<dialog id="qr-dialog" class="qr-dialog">
				<button class="close-btn" onclick="document.getElementById('qr-dialog').close()">
					<i class="fa-solid fa-xmark"></i>	
				</button>
				<div class="qr-section">
					<h2>Scan the QR Code to Download</h2>
					<p>Open the link in your mobile browser to download the app.</p>
					<img src="./assets/images/qr.png" alt="">
				</div>
			</dialog>
			
			<!-- screenshots -->
			<div class="flex flex-wrap justify-center items-end gap-4 mt-10">
				<img src="./assets/screenshots/2.jpeg" alt="" class="screenshot w-[19%]">
				<img src="./assets/screenshots/1.jpeg" alt="" class="screenshot w-[16%]">
			</div>
		</div>
	</main>
	<script src="./script.js"></script>
</body>

</html>
